baseURL = 'https://luarss.dev/'
locale = 'en-us'
title = "Shui Song Luar"
theme = "PaperMod"
enableRobotsTXT = true
# No tagged content yet — drop empty /tags/ and /categories/ pages so the
# sitemap stops advertising URLs that robots.txt disallows.
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[params]
  author = "Shui Song Luar"
  description = "Personal site of Shui Song Luar — Founding Engineer at SoraNova working on production LLM systems, multi-agent AI workflows, cloud infrastructure, and full-stack development. Based in Singapore."
  keywords = ["Shui Song Luar", "luarss", "AI engineer", "LLM systems", "RAG", "multi-agent systems", "MCP", "founding engineer", "Singapore", "OpenROAD", "SoraNova"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowToc = true

  [params.schema]
    publisherType = "Person"
    sameAs = [
      "https://github.com/luarss",
      "https://www.linkedin.com/in/song-luar/",
      "https://dev.to/luarss",
    ]

  [params.profileMode]
    enabled = true
    title = "Shui Song Luar"
    subtitle = "Founding Engineer · AI/ML Systems · Singapore"
    imageUrl = ""
    [[params.profileMode.buttons]]
      name = "About"
      url = "/about/"
    [[params.profileMode.buttons]]
      name = "Now"
      url = "/now/"
    [[params.profileMode.buttons]]
      name = "Projects"
      url = "/projects/"
    [[params.profileMode.buttons]]
      name = "llms.txt"
      url = "/llms.txt"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/luarss"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/song-luar/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:me@luarss.dev"

[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 1
  [[menu.main]]
    name = "Now"
    url = "/now/"
    weight = 2
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3
