name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - topic/hugo-dev

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: recursive

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
      with:
        hugo-version: '0.161.1'
        extended: true

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'

    - name: Build site
      run: hugo --minify -s hugo

    # Private pages are committed already-encrypted (staticrypt) in the repo, so
    # CI does NOT encrypt — it only guards against ever shipping plaintext. If a
    # built page lost its staticrypt bootstrap (e.g. someone committed the
    # cleartext by mistake), fail hard rather than publish the document.
    - name: Verify private pages are encrypted
      run: |
        for page in hugo/public/COB_FLOW.html hugo/public/TTI_CONTRACT_DEMO.html hugo/public/NUSX_LABS_ROADMAP_KEYNOTE_V2_20261005.html; do
          [ -f "$page" ] || { echo "::error::$page missing from build"; exit 1; }
          grep -q "staticrypt" "$page" \
            || { echo "::error::$page is not encrypted — refusing to deploy"; exit 1; }
        done

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./hugo/public
        publish_branch: gh-pages
        cname: luarss.dev
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
