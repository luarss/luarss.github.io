name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - topic/hugo-dev

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: recursive

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
      with:
        hugo-version: '0.161.1'
        extended: true

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'

    - name: Build site
      run: hugo --minify -s hugo

    # The COB page is committed already-encrypted (staticrypt) in the repo, so
    # CI does NOT encrypt — it only guards against ever shipping plaintext. If
    # the built page lost its staticrypt bootstrap (e.g. someone committed the
    # cleartext by mistake), fail hard rather than publish the document.
    - name: Verify private page is encrypted
      run: |
        page=hugo/public/COB_FLOW.html
        [ -f "$page" ] || { echo "::error::$page missing from build"; exit 1; }
        grep -q "staticrypt" "$page" \
          || { echo "::error::COB_FLOW.html is not encrypted — refusing to deploy"; exit 1; }

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./hugo/public
        publish_branch: gh-pages
        cname: luarss.dev
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

  submit-wayback:
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://luarss.dev/
          - https://luarss.dev/about/
          - https://luarss.dev/now/
          - https://luarss.dev/posts/
          - https://luarss.dev/projects/
    steps:
      # Best-effort archival — transient Internet Archive (SPN2) failures
      # shouldn't fail the deploy workflow.
      - uses: JamieMagee/wayback@e561c5018fb0e62988fddd732fb88345a3faa608 # v2.2.0
        continue-on-error: true
        with:
          url: ${{ matrix.url }}
