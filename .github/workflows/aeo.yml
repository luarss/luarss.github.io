name: AEO presence tracking

# Weekly free/automated snapshot of search-index presence (Google + Bing),
# which is the retrieval substrate that AI answer engines draw from.
on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r aeo/requirements.txt

      - name: Pull Google Search Console
        working-directory: aeo
        env:
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        run: python gsc_pull.py

      - name: Pull Bing Webmaster
        working-directory: aeo
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BING_SITE_URL: ${{ vars.BING_SITE_URL }}
        run: python bing_pull.py

      - name: Commit snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add aeo/results
          if git diff --cached --quiet; then
            echo "no new snapshots"
          else
            git commit -m "chore(aeo): weekly presence snapshot"
            git push
          fi
