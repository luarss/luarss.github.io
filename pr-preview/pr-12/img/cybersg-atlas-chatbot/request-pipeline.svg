<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 820" width="780" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Request pipeline of the CyberSG Atlas chatbot"><title>Request pipeline of the CyberSG Atlas chatbot</title><style>text{paint-order:stroke;stroke:#fcfcfb;stroke-width:3px;stroke-linejoin:round}</style><rect width="780" height="820" rx="12" fill="#fcfcfb"/><text x="40" y="40" font-size="18" fill="#0b0b0b" font-weight="600" text-anchor="start">What happens to one question</text><text x="40" y="64" font-size="14" fill="#52514e" font-weight="400" text-anchor="start">Blue boxes can call the model. Everything else is ordinary code.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8983"/></marker></defs><rect x="40" y="96" width="400" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/><text x="56" y="119" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Check signed history, rate limits, spend cap</text><text x="56" y="139" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">the client cannot forge earlier answers</text><line x1="240.0" y1="152" x2="240.0" y2="170" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="124.0" x2="496" y2="124.0" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="508" y="129.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">rejected</text><rect x="40" y="172" width="400" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/><text x="56" y="195" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Fixed replies</text><text x="56" y="215" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">self-harm, data handling, privacy</text><line x1="240.0" y1="228" x2="240.0" y2="246" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="200.0" x2="496" y2="200.0" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="508" y="205.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">fixed reply, no model call</text><rect x="40" y="248" width="400" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/><text x="56" y="271" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Listings built in code</text><text x="56" y="291" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">“list all”, counts, by letter</text><line x1="240.0" y1="304" x2="240.0" y2="322" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="276.0" x2="496" y2="276.0" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="508" y="281.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">alphabetical list, no model call</text><rect x="40" y="324" width="400" height="56" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="56" y="347" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Prepare the search</text><text x="56" y="367" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">strip old notices; non-Latin questions → English keywords</text><line x1="240.0" y1="380" x2="240.0" y2="398" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="400" width="400" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/><text x="56" y="423" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">BM25 retrieval</text><text x="56" y="443" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">at most 8 directory entries</text><line x1="240.0" y1="456" x2="240.0" y2="474" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="428.0" x2="496" y2="428.0" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="508" y="433.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">nothing found: refusal, no model call</text><rect x="40" y="476" width="400" height="56" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/><text x="56" y="499" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Gemini writes the answer</text><text x="56" y="519" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">thinking disabled</text><line x1="240.0" y1="532" x2="240.0" y2="550" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="552" width="400" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/><text x="56" y="575" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Link policy</text><text x="56" y="595" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">unknown URLs → [link removed]</text><line x1="240.0" y1="608" x2="240.0" y2="626" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="628" width="400" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/><text x="56" y="651" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Scope gate</text><text x="56" y="671" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">no company, code block, local-model claim</text><line x1="240.0" y1="684" x2="240.0" y2="702" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="656.0" x2="496" y2="656.0" stroke="#8a8983" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="508" y="652.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">fixed refusal, or the SingCERT / CSA</text><text x="508" y="670.0" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">notice alone</text><rect x="40" y="704" width="400" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/><text x="56" y="727" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">Add missing notices, matches, signature</text><text x="56" y="747" font-size="13" fill="#52514e" font-weight="400" text-anchor="start">SingCERT, CSA programmes, “View all N”</text><line x1="240.0" y1="760" x2="240.0" y2="776" stroke="#8a8983" stroke-width="1.5" marker-end="url(#arrow)"/><text x="240.0" y="794" font-size="13" fill="#52514e" font-weight="400" text-anchor="middle">reply shown in the widget</text><text x="508" y="82" font-size="13" fill="#8a8983" font-weight="600" text-anchor="start">Exits that never show a model answer</text></svg>
